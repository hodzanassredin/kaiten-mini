[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kaiten-cli"
version = "0.1.0"
description = "Small CLI for the Kaiten REST API (cards, comments, time logs) — agent-friendly JSON output"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "httpx[socks]>=0.27.0",  # socks extra: иначе падает в окружениях с ALL_PROXY=socks://...
]

[project.scripts]
kaiten = "kaiten_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kaiten_cli"]
